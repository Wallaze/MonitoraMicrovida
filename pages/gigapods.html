<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigapods - Monitoramento</title>

  <!-- Favicon Padronizado -->
  <link rel="icon" type="image/png" href="https://cdn.awsli.com.br/724/724789/arquivos/Logo.png">
  <link rel="apple-touch-icon" href="https://cdn.awsli.com.br/724/724789/arquivos/Logo.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <!-- CSS Global -->
  <link rel="stylesheet" href="../css/style.css">

  <!-- Script Global Compartilhado -->
  <script type="module" src="../js/script.js"></script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 p-4 relative flex flex-col items-center">

  <!-- Wrapper da Aplicação -->
  <div class="w-full max-w-md space-y-4">

    <!-- Banner Horizontal da Cultura -->
    <div class="w-full rounded-xl overflow-hidden border border-slate-700/80 shadow-lg bg-slate-800/40 no-print">
      <img src="https://cdn.awsli.com.br/724/724789/banner/mini_banner_categoria_gigapods-l2iohn7npp.png"
           alt="Banner Gigapods"
           class="w-full h-auto object-cover block">
    </div>

    <!-- Painel Principal / Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-xl p-6 space-y-4">

      <!-- Header Interno do Card -->
      <div class="border-b border-slate-700 pb-3 flex justify-between items-center gap-3">
        <div>
          <span class="text-[10px] bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-full font-bold">
            <i>Tigriopus californicus</i>
          </span>
          <h1 class="text-lg font-bold bg-gradient-to-r from-amber-400 to-amber-200 bg-clip-text text-transparent mt-1">
            Gigapods
          </h1>
          <p class="text-[11px] text-slate-400">Início e Anotações Diárias</p>
        </div>

        <a href="../index.html" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 shadow-md no-print">
          <span>&larr;</span> Voltar
        </a>
      </div>

      <!-- Seletor de Modalidade -->
      <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700 text-xs font-bold no-print">
        <button type="button" id="tabInicio" class="flex-1 py-2 text-center rounded-md bg-amber-500 text-slate-950 transition-all">
          🚀 Início de Cultura
        </button>
        <button type="button" id="tabDiaria" class="flex-1 py-2 text-center rounded-md text-slate-400 hover:text-slate-200 transition-all">
          📅 Anotação Diária
        </button>
      </div>

      <!-- Formulário Principal -->
      <form id="cultivoForm" class="space-y-4 no-print">
        <input type="hidden" id="tipoRegistro" value="inicio">

        <!-- Metadados Automáticos -->
        <div class="grid grid-cols-2 gap-3 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
          <div>
            <label class="block text-[11px] font-semibold text-slate-400">Data e Hora (Auto)</label>
            <input type="datetime-local" id="dataRegistro" readonly class="w-full bg-slate-800 text-slate-300 text-xs p-1.5 rounded border border-slate-700 cursor-not-allowed">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-400">Temp. Clima (Auto)</label>
            <div class="flex items-center gap-1 mt-0.5">
              <input type="text" id="tempAmbiente" readonly value="Buscando..." class="w-full bg-slate-800 text-amber-400 font-bold text-xs p-1.5 rounded border border-slate-700 cursor-not-allowed">
              <span class="text-xs text-slate-400">°C</span>
            </div>
          </div>
        </div>

        <!-- Seção: Início de Cultura -->
        <div id="secaoInicio" class="space-y-3 bg-slate-900/30 p-3 rounded-lg border border-amber-500/20">
          <p class="text-xs font-bold text-amber-400 border-b border-amber-500/20 pb-1">Configurações do Novo Lote</p>

          <div>
            <label class="block text-[11px] font-semibold text-slate-300">Identificação da Cultura / Lote (obrigatório)</label>
            <input type="text" id="inicioNomeCultura" placeholder="Ex: Lote #01 - Aquário Principal" class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100 focus:outline-none focus:border-amber-500">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-300">Recipiente</label>
              <input type="text" id="inicioRecipiente" placeholder="Ex: Galão/Bandeja..." class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-300">Litragem (L)</label>
              <input type="number" step="0.1" id="inicioLitragem" placeholder="Ex: 15" class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-300">Substrato</label>
            <input type="text" id="inicioSubstrato" placeholder="Ex: Mídia Cerâmica / Sem Substrato" class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-slate-300">Descrição da Iluminação</label>
            <input type="text" id="inicioIluminacaoDesc" placeholder="Ex: LED Full Spectrum 10W - 12h/dia" class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
          </div>

          <div>
            <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer bg-slate-900 p-2 rounded border border-slate-700">
              <input type="checkbox" id="inicioAeracao" class="w-4 h-4 text-amber-500 rounded border-slate-700 bg-slate-900 focus:ring-0"> Aeração Ativa
            </label>
          </div>
        </div>

        <!-- Seção: Anotação Diária -->
        <div id="secaoDiaria" class="hidden space-y-3 bg-slate-900/30 p-3 rounded-lg border border-emerald-500/20">
          <p class="text-xs font-bold text-emerald-400 border-b border-emerald-500/20 pb-1">Parâmetros Diários</p>

          <div>
            <label class="block text-[11px] font-semibold text-slate-300">Cultura Referente (obrigatório)</label>
            <select id="diariaCulturaRef" class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100 focus:outline-none focus:border-emerald-500">
              <option value="">Selecione o Lote / Cultura...</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-semibold text-slate-300">Temp. Água (°C)</label>
              <input type="number" step="0.1" id="diariaTempAgua" placeholder="Ex: 25.5" class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-slate-300">pH</label>
              <input type="number" step="0.1" id="diariaPh" placeholder="Ex: 8.2" class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[10px] font-semibold text-slate-300">Amônia</label>
              <input type="number" step="0.01" id="diariaAmonia" placeholder="0.0" class="w-full border border-slate-700 p-1.5 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-slate-300">Nitrato</label>
              <input type="number" step="0.1" id="diariaNitrato" placeholder="0.0" class="w-full border border-slate-700 p-1.5 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-slate-300">Fosfato</label>
              <input type="number" step="0.01" id="diariaFosfato" placeholder="0.0" class="w-full border border-slate-700 p-1.5 rounded-md mt-1 text-xs bg-slate-900 text-slate-100">
            </div>
          </div>
        </div>

        <!-- Salinidade -->
        <div>
          <label class="block text-xs font-semibold text-slate-300">Salinidade (Densidade)</label>
          <input type="number" min="1000" max="1040" id="salinidade" placeholder="Ex: 1020" class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100 focus:outline-none focus:border-amber-500">
          <span class="text-[10px] text-slate-500">Ex: 1020, 1022...</span>
        </div>

        <!-- Vídeo -->
        <div class="border-t border-slate-700 pt-3 text-center space-y-2">
          <p id="labelVideo" class="text-xs font-semibold text-amber-400">População em Vídeo (10s Obrigatórios)</p>
          <video id="videoPreview" autoplay playsinline muted class="w-full h-44 bg-black rounded-lg object-cover border border-slate-700"></video>
          <div id="cronometro" class="hidden text-amber-400 font-bold text-sm animate-pulse">
            Gravando: <span id="tempoRestante">10</span>s
          </div>
          <button type="button" id="btnGravar" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-md font-semibold text-sm transition-all">
            🎥 Gravar Vídeo (10s)
          </button>
        </div>

        <!-- Observações -->
        <div class="border-t border-slate-700 pt-3">
          <label class="block text-xs font-semibold text-slate-300">Observações</label>
          <textarea id="observacoes" rows="2" placeholder="Anotações gerais..." class="w-full border border-slate-700 p-2 rounded-md mt-1 text-xs bg-slate-900 text-slate-100 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <!-- Botão Salvar -->
        <div class="border-t border-slate-700 pt-3">
          <button type="submit" id="btnSalvar" disabled class="w-full bg-slate-700 text-slate-400 py-3 rounded-md font-bold cursor-not-allowed transition-all">
            Salvar Registro
          </button>
        </div>
        <p id="mensagemStatus" class="text-xs text-center font-semibold text-amber-400"></p>
      </form>

      <!-- Histórico -->
      <div class="border-t border-slate-700 pt-4 space-y-3">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
          <h2 class="text-sm font-bold text-slate-200">
            Histórico do Cultivo
          </h2>

          <!-- Ações e Filtros do Histórico -->
          <div class="flex items-center gap-2 w-full sm:w-auto no-print">
            <select id="filtroTipo" class="bg-slate-900 text-slate-300 text-[11px] p-1.5 rounded border border-slate-700 focus:outline-none focus:border-amber-500 flex-1 sm:flex-initial">
              <option value="todos">Todos os registros</option>
              <option value="inicio">Apenas Inícios</option>
              <option value="diaria">Apenas Diários</option>
            </select>

            <button type="button" id="btnImprimir" title="Imprimir Relatório ou Salvar em PDF" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs px-2.5 py-1.5 rounded border border-slate-600 transition-all flex items-center gap-1">
              🖨️ <span class="hidden sm:inline">PDF</span>
            </button>
          </div>
        </div>

        <!-- Container dinâmico com rolagem interna -->
        <div id="historicoContainer" class="space-y-3 max-h-80 overflow-y-auto text-xs pr-1">
          <!-- O conteúdo do histórico é renderizado dinamicamente via JavaScript -->
        </div>
      </div>

    </div>

  </div>

  <!-- Botão Voltar ao Topo -->
  <button id="btnTopo" onclick="voltarAoTopo()" class="hidden fixed bottom-5 right-5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold p-3 rounded-full shadow-lg transition-all z-50 focus:outline-none no-print" title="Voltar ao Topo">
    ⬆️
  </button>

  <!-- Script inline de atalho visual para a alternância das abas -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tabInicio = document.getElementById('tabInicio');
      const tabDiaria = document.getElementById('tabDiaria');
      const secaoInicio = document.getElementById('secaoInicio');
      const secaoDiaria = document.getElementById('secaoDiaria');
      const tipoRegistro = document.getElementById('tipoRegistro');

      if (tabInicio && tabDiaria) {
        tabInicio.addEventListener('click', () => {
          tipoRegistro.value = 'inicio';
          tabInicio.className = 'flex-1 py-2 text-center rounded-md bg-amber-500 text-slate-950 transition-all font-bold';
          tabDiaria.className = 'flex-1 py-2 text-center rounded-md text-slate-400 hover:text-slate-200 transition-all';
          secaoInicio.classList.remove('hidden');
          secaoDiaria.classList.add('hidden');
        });

        tabDiaria.addEventListener('click', () => {
          tipoRegistro.value = 'diaria';
          tabDiaria.className = 'flex-1 py-2 text-center rounded-md bg-emerald-500 text-slate-950 transition-all font-bold';
          tabInicio.className = 'flex-1 py-2 text-center rounded-md text-slate-400 hover:text-slate-200 transition-all';
          secaoDiaria.classList.remove('hidden');
          secaoInicio.classList.add('hidden');
        });
      }
    });
  </script>
</body>
</html>
